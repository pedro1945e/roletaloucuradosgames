c.save();c.translate(CX,CY-RP-L);c.rotate(-Math.asin(Math.max(-1,Math.min(1,X/L))));c.beginPath();c.moveTo(-11,0);c.lineTo(11,0);c.lineTo(0,L);c.closePath();c.fillStyle='#ff3d4f';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.lineJoin='round';c.stroke();c.beginPath();c.arc(0,0,9,0,TAU);c.fillStyle='#ffd23f';c.fill();c.strokeStyle='#2b1d5c';c.stroke();c.restore()}
window.addEventListener('resize',()=>{if(tab==='play')draw()});
function phys(t,dt){const{s,xm}=geo(),progress=Math.min((t-spinStartedAt)/spinDuration,1),oldAngle=A;
const eased=1-Math.pow(1-progress,2);A=spinStartAngle+(spinTargetAngle-spinStartAngle)*eased;
W=(spinTargetAngle-spinStartAngle)*2*(1-progress)/(spinDuration/1000);
if(Math.floor(oldAngle/s)!==Math.floor(A/s))XV+=Math.sign(A-oldAngle)*Math.min(320,Math.abs(W)*14);
if(dt>0&&(X!==0||XV!==0)){const damping=CD/2,frequency=Math.sqrt(KS-damping*damping),b=(XV+damping*X)/frequency,decay=Math.exp(-damping*dt),cos=Math.cos(frequency*dt),sin=Math.sin(frequency*dt),x=X,v=XV;
X=decay*(x*cos+b*sin);XV=decay*((-damping*x+frequency*b)*cos+(-damping*b-frequency*x)*sin);
if(X>xm){X=xm;XV=-Math.abs(XV)*.25}else if(X< -xm){X=-xm;XV=Math.abs(XV)*.25}}
if(progress>=1&&Math.abs(X)<.15&&Math.abs(XV)<3)fin()}
function loop(t){const dt=Math.min((t-last)/1e3,.04);last=t;phys(t,dt);draw();if(spinning){const i=idxAt();if(i!==liveI){liveI=i;if(items.length>MAX_LABELLED_ITEMS)showWheelItem(i);else $('#rs').textContent=items[i].l}requestAnimationFrame(loop)}}
function spin(){if(spinning||transitionTimer||challengeTimer||!items.length)return;const step=TAU/items.length,target=Math.floor(Math.random()*items.length),targetAngle=TAU-(target+.5)*step;
spinStartAngle=A;spinTargetAngle=A+(5+Math.floor(Math.random()*3))*TAU+((targetAngle-((A%TAU+TAU)%TAU)+TAU)%TAU);
spinStartedAt=performance.now();spinDuration=5000+Math.random()*800;spinning=true;liveI=-1;HI=-1;res=null;X=0;XV=0;W=0;$('#sp').disabled=true;last=spinStartedAt;requestAnimationFrame(loop)}
function fin(){spinning=false;A=((A%TAU)+TAU)%TAU;X=0;XV=0;$('#sp').disabled=false;HI=idxAt();res=items[HI];if(!res){console.error('A roleta terminou sem uma opção selecionada.');$('#rs').textContent='Não foi possível determinar o resultado. Tente novamente.';return}showWheelItem(HI);draw();
$('#rs').innerHTML='Resultado: '+esc(res.l)+(res.next?' → próxima roleta…':'');
if(res.next){const source=cur.src,next=res.next,label=res.l;$('#sp').disabled=true;transitionTimer=setTimeout(()=>{transitionTimer=null;$('#sp').disabled=false;if(cur.src!==source||spinning)return;cur.src=next;cur.trail.push(label);refreshPlay()},3000)}else if(res.gid||curW.ch){$('#mt').textContent=res.l;$('#sp').disabled=true;challengeTimer=setTimeout(()=>{challengeTimer=null;$('#sp').disabled=false;$('#md').hidden=false},2000)}}
function ans(ok){$('#md').hidden=true;if(ok&&res)mut(()=>{if(res.gid)S.games[res.gid].st='acc';S.hist.unshift({id:uid(),gid:res.gid||null,n:res.l,st:'acc',d:Date.now()})})}
const chip=(v,l)=>`<button class="chip ${cur.src==v?'on':''}" onclick="pick('${v}')">${l}</button>`;
function pick(v){if(spinning)return;if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=null;$('#sp').disabled=false}if(challengeTimer){clearTimeout(challengeTimer);challengeTimer=null;$('#sp').disabled=false}cur={src:v,trail:[]};refreshPlay()}
function refreshPlay(){if(cur.src.startsWith('cat:')&&!cat(cur.src.slice(4))||cur.src.startsWith('w:')&&!wh(cur.src.slice(2)))cur={src:'games',trail:[]};
curW=getW(cur.src);items=curW.it;HI=-1;liveI=-1;X=0;XV=0;
$('#src').innerHTML='<div class=grp>'+chip('games','🎲 Jogos')+chip('caral','🌪️ Caralhow')+chip('fav','★ Favoritos')+'</div>'+(S.cats.length?'<div class=lbl>Categorias</div><div class=grp>'+S.cats.map(c=>chip('cat:'+c.id,esc(c.n))).join('')+'</div>':'')+(S.wheels.length?'<div class=lbl>Minhas roletas</div><div class=grp>'+S.wheels.map(w=>chip('w:'+w.id,esc(w.n))).join('')+'</div>':'');
showWheelItem(items.length?idxAt():-1);$('#bc').innerHTML=cur.trail.length?cur.trail.map(esc).join(' → ')+` <button onclick="cur={src:'games',trail:[]};refreshPlay()">Início</button>`:'';$('#rs').textContent=items.length?'':'Nada disponível nesta roleta.';draw()}
// ---- views
function gRow(c,i){const g=S.games[i];return`<div class=row><button onclick="mut(()=>S.games['${i}'].fav^=1)">${g.fav?'★':'☆'}</button><input value="${esc(g.n)}" onchange="mut(()=>S.games['${i}'].n=this.value)">${g.st!='avail'?`<small>${g.st}</small>`:''}<button onclick="mut(()=>S.games['${i}'].on^=1)">${g.on?'on':'off'}</button><select onchange="mv('${c.id}','${i}',this.value)"><option>mover…</option>${S.cats.filter(x=>x.id!=c.id).map(x=>`<option value=${x.id}>${esc(x.n)}</option>`).join('')}</select><button title="tirar desta categoria" onclick="mut(()=>c_=cat('${c.id}').g=cat('${c.id}').g.filter(x=>x!='${i}'))">−</button><button title="excluir jogo" onclick="delG('${i}')">🗑</button></div>`}
function mv(a,i,b){if(b=='mover…')return;mut(()=>{cat(a).g=cat(a).g.filter(x=>x!=i);if(!cat(b).g.includes(i))cat(b).g.push(i)})}
function delG(i){mut(()=>{delete S.games[i];S.cats.forEach(c=>c.g=c.g.filter(x=>x!=i));S.hist=S.hist.filter(h=>h.gid!=i)})}
function addG(cid){const el=$('#a'+cid),v=el.value.trim();if(!v)return;const id=norm(v);mut(()=>{if(!S.games[id])S.games[id]={n:v,on:1,st:'avail',fav:0};if(!cat(cid).g.includes(id))cat(cid).g.push(id)})}
function addC(){const v=$('#nc').value.trim();if(v)mut(()=>S.cats.push({id:uid(),n:v,on:1,g:[]}))}
function vLib(){return`<div class=row><input id=nc placeholder="Nova categoria"><button class=p onclick="addC()">Criar categoria</button></div>`+S.cats.map(c=>`<details ${OP.has(c.id)?'open':''} ontoggle="this.open?OP.add('${c.id}'):OP.delete('${c.id}')"><summary><b>${esc(c.n)}</b> <small>${c.g.filter(avail).length}/${c.g.length} disponíveis${c.on?'':' · desativada'}</small></summary>
<div class=row><input value="${esc(c.n)}" onchange="mut(()=>cat('${c.id}').n=this.value)"><button onclick="mut(()=>cat('${c.id}').on^=1)">${c.on?'Desativar':'Ativar'}</button><button onclick="mut(()=>S.cats=S.cats.filter(x=>x.id!='${c.id}'))">Excluir categoria</button></div>${c.g.map(i=>gRow(c,i)).join('')}
<div class=row><input id="a${c.id}" placeholder="Novo jogo"><button onclick="addG('${c.id}')">Adicionar</button></div></details>`).join('')}
function addW(){const v=$('#nw').value.trim();if(v)mut(()=>S.wheels.push({id:uid(),n:v,ch:/filme|jogo/i.test(v)?1:0,o:[]}))}
function addO(id){const t=$('#o'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);if(t.length)mut(()=>t.forEach(x=>wh(id).o.push({t:x,to:''})))}
function dup(id){mut(()=>{const w=JSON.parse(JSON.stringify(wh(id)));w.id=uid();w.n+=' (cópia)';S.wheels.push(w)})}
function vWl(){return`<div class=row><input id=nw placeholder="Nova roleta (ex.: Filmes)"><button class=p onclick="addW()">Criar</button></div>`+S.wheels.map(w=>`<details ${OP.has(w.id)?'open':''} ontoggle="this.open?OP.add('${w.id}'):OP.delete('${w.id}')"><summary><b>${esc(w.n)}</b> <small>${w.o.length} opções</small></summary>
<div class=row><input value="${esc(w.n)}" onchange="mut(()=>wh('${w.id}').n=this.value)"><label><input type=checkbox style="min-width:0" ${w.ch?'checked':''} onchange="mut(()=>wh('${w.id}').ch=this.checked?1:0)"> aceitar/recusar</label></div>
${w.o.map((o,k)=>`<div class=row><input value="${esc(o.t)}" onchange="mut(()=>wh('${w.id}').o[${k}].t=this.value)"><select onchange="mut(()=>wh('${w.id}').o[${k}].to=this.value)"><option value="">resultado final</option><option value=games ${o.to=='games'?'selected':''}>→ Jogos</option>${S.cats.map(c=>`<option value="cat:${c.id}" ${o.to=='cat:'+c.id?'selected':''}>→ ${esc(c.n)}</option>`).join('')}${S.wheels.filter(x=>x.id!=w.id).map(x=>`<option value="w:${x.id}" ${o.to=='w:'+x.id?'selected':''}>→ ${esc(x.n)}</option>`).join('')}</select><button onclick="mut(()=>wh('${w.id}').o.splice(${k},1))">×</button></div>`).join('')}
<textarea id="o${w.id}" rows=2 placeholder="Novas opções, uma por linha"></textarea><div class=row><button onclick="addO('${w.id}')">Adicionar opções</button><button class=p onclick="cur={src:'w:${w.id}',trail:[]};tab='play';render()">Girar</button><button onclick="dup('${w.id}')">Duplicar</button><button onclick="mut(()=>S.wheels=S.wheels.filter(x=>x.id!='${w.id}'))">Excluir</button></div></details>`).join('')||'<p class=mu>Nenhuma roleta própria ainda. Categorias de jogos viram roletas automaticamente.</p>'}
function setH(id,v){mut(()=>{const h=S.hist.find(x=>x.id==id);h.st=v;if(h.gid&&S.games[h.gid])S.games[h.gid].st=v})}
function retH(id){mut(()=>{const h=S.hist.find(x=>x.id==id);if(h.gid&&S.games[h.gid])S.games[h.gid].st='avail';S.hist=S.hist.filter(x=>x.id!=id)})}
function vHist(){return S.hist.length?S.hist.map(h=>`<div class=row><b style="flex:1">${esc(h.n)}</b><small>${new Date(h.d).toLocaleDateString('pt-BR')}</small><select onchange="setH('${h.id}',this.value)">${[['acc','Aceito'],['prog','Em andamento'],['done','Concluído']].map(([v,l])=>`<option value=${v} ${h.st==v?'selected':''}>${l}</option>`).join('')}</select><button onclick="retH('${h.id}')">Devolver à biblioteca</button></div>`).join(''):'<p class=mu>Nenhum desafio aceito ainda.</p>'}
function imp(){try{const o=JSON.parse($('#im').value);if(!o.games||!o.cats)throw 0;mut(()=>{S=o})}catch(e){alert('JSON inválido')}}
function vDt(){return`<p>Backup: copie o texto abaixo e guarde num arquivo.</p><textarea readonly onclick="this.select()">${esc(JSON.stringify(S))}</textarea><p>Restaurar: cole um backup aqui.</p><textarea id=im></textarea><div class=row><button class=p onclick="imp()">Importar</button><button onclick="if(confirm('Restaurar lista original? (dá para desfazer)'))mut(()=>{S=seed()})">Restaurar lista original</button></div>`}
function render(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');$('#play').hidden=tab!='play';$('#v').hidden=tab=='play';$('#hs').innerHTML=vHist();
if(tab=='play'){if(!spinning)refreshPlay()}else $('#v').innerHTML=({lib:vLib,wl:vWl,dt:vDt})[tab]()}
save();render();
</script></body></html>
